<title>The Last Video Store</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: one arcade-cabinet column. VHS-sleeve marquee, the screen, controls, then a rental-box-back design sheet. */
:root{
  color-scheme: dark;
  --bg:#2b150f; --panel:#45221a; --line:#7a3f26; --cream:#ffe9c2; --muted:#d9a87c;
  --orange:#ff9a3c; --red:#e8453c; --slime:#c8f05a; --pink:#ff5fa8; --teal:#3ad6c0; --mustard:#ffc93c;
  --p1:#ff5a4a; --p2:#3ad6c0; --p3:#c8f05a; --p4:#ffc93c;
  --display:'Bungee', Impact, 'Arial Black', sans-serif;
  --pixel:'Press Start 2P', ui-monospace, monospace;
  --body:'VT323', ui-monospace, 'Courier New', monospace;
}
html{background:var(--bg)}
body{color:var(--cream);background:radial-gradient(ellipse 120% 60% at 50% -10%,#6a2a1a 0%,var(--bg) 60%)}
body{
  font-family:var(--body);font-size:20px;line-height:1.25;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:8px;margin:0;
}
html,body{height:100%}
body{box-sizing:border-box;overflow-x:hidden}
.wrap{margin:0 auto;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;--padh:0px}
@media (hover:none) and (pointer:coarse){.wrap{--padh:150px}}
/* phones held sideways: the game takes the full height and the controls float over its bottom corners */
@media (hover:none) and (pointer:coarse) and (orientation:landscape){
  .wrap{--padh:0px}
  .pad{position:fixed;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:8px;width:auto;pointer-events:none;opacity:.82}
  .pad>*{pointer-events:auto}
  .dpad{width:112px;height:112px}.dpad::before{left:37px;top:10px;width:38px;height:92px}.dpad::after{top:37px;left:10px;height:38px;width:92px}
  .btns button{width:54px;height:54px}
  .startbtn{position:fixed;bottom:128px;left:max(8px,env(safe-area-inset-left,0px));width:52px;height:24px}
  .gearbtn{left:calc(max(8px,env(safe-area-inset-left,0px)) + 58px)}
}
.marquee{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:repeating-conic-gradient(from 0deg at 50% 150%,#c43a2a 0deg 9deg,#e8663a 9deg 18deg);border:3px solid var(--mustard);border-radius:6px;padding:12px 16px;position:relative;overflow:hidden;box-shadow:0 6px 0 #1c0b07,0 0 0 2px #1c0b07}
.marquee::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(43,21,15,0) 30%,rgba(43,21,15,.55) 100%);pointer-events:none}
.marquee>*{position:relative;z-index:1}
.stripes{width:46px;height:52px;flex:none;background:linear-gradient(115deg,transparent 0 18%,var(--mustard) 18% 38%,var(--teal) 38% 58%,var(--cream) 58% 72%,transparent 72%)}
.marquee h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5.4vw,46px);line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance;color:var(--mustard);text-shadow:3px 3px 0 #1c0b07,-1px -1px 0 #1c0b07,1px -1px 0 #1c0b07,-1px 1px 0 #1c0b07}
.marquee h1 span{color:var(--slime)}
.marquee .tagline{color:var(--slime);font-weight:400;letter-spacing:.04em}
.marquee p{margin:4px 0 0;color:var(--cream);font-size:20px;text-shadow:1px 1px 0 #1c0b07}
.titles{flex:1;min-width:0}
.sticker{flex:none;width:76px;height:76px;border-radius:50%;background:var(--mustard);border:3px dashed #1c0b07;color:#1a0f08;display:grid;place-items:center;text-align:center;font-family:var(--pixel);font-size:8px;line-height:1.5;transform:rotate(-12deg);box-shadow:2px 3px 0 #000}
.screen{width:min(calc(100vw - 40px),calc((100vh - 40px - var(--padh)) * 16 / 9));background:#000;border:6px solid #5e2f22;border-radius:8px;box-shadow:0 0 0 3px #1c0b07,0 0 0 6px var(--mustard),0 24px 50px rgba(0,0,0,.55)}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:auto;cursor:pointer;outline:none}
canvas:focus-visible{box-shadow:0 0 0 3px var(--orange)}
.pad{display:none;width:min(100%,900px);justify-content:space-between;align-items:center;gap:12px;touch-action:none;user-select:none;-webkit-user-select:none}
@media (hover:none) and (pointer:coarse){.pad{display:flex}.kbd-only{display:none}}
.dpad{width:132px;height:132px;border-radius:50%;background:var(--panel);border:2px solid var(--line);position:relative;flex:none}
.dpad::before,.dpad::after{content:"";position:absolute;background:#7a3f26;border-radius:6px}
.dpad::before{left:44px;top:12px;width:44px;height:108px}
.dpad::after{top:44px;left:12px;height:44px;width:108px}
.btns{display:flex;gap:10px;align-items:flex-end}
.btns button,.startbtn{font-family:var(--pixel);font-size:9px;color:var(--cream);border:2px solid #000;border-radius:50%;width:64px;height:64px;background:var(--red);box-shadow:0 4px 0 #000;touch-action:none}
.btns button[data-act="jump"]{background:#1f9e8e;margin-bottom:22px}
.btns button[data-act="spec"]{background:#d9771e}
.btns button:active,.startbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.startbtn{width:64px;height:28px;border-radius:14px;background:#7a3f26;font-size:8px}
.gearbtn{background:#1f6e66}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px}
.ctl{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:10px 14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;min-width:0}
.ctl h3{width:100%;margin:0 0 2px;font-family:var(--pixel);font-size:9px;letter-spacing:.06em;font-weight:400;line-height:1.6}
.ctl h3{color:var(--pc,var(--mustard))}
.ctl.note span{color:var(--muted)}
kbd{font-family:var(--pixel);font-size:9px;color:#1c0b07;background:var(--cream);border:1px solid #1c0b07;border-bottom-width:3px;border-radius:4px;padding:4px 6px;margin-right:4px}
.pads{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.padhead{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
.pads h2{font-family:var(--pixel);font-size:10px;letter-spacing:.06em;color:var(--p3);margin:0;line-height:1.6;font-weight:400}
.pads h3{font-family:var(--pixel);font-size:8px;letter-spacing:.06em;color:var(--mustard);margin:0 0 6px;font-weight:400;line-height:1.6}
.padhead p{margin:0;color:var(--muted)}
.padlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px}
.padlist:empty{display:none}
.padlist li{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;background:#331a12;border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-width:0}
.padlist .dot{width:12px;height:12px;border-radius:50%;flex:none}
.padlist b{font-weight:400;color:var(--cream);overflow-wrap:anywhere;min-width:0}
.padlist li>span:last-child{width:100%;padding-left:22px;color:var(--muted)}
.padgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px;color:var(--muted)}
.padgrid b{color:var(--cream);font-weight:400}
.padhead p b{color:var(--cream)}
.srv{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;color:var(--muted)}
.srv input{flex:1;min-width:min(100%,260px);font-family:var(--body);font-size:20px;color:var(--cream);background:#241008;border:2px solid var(--line);border-radius:4px;padding:6px 10px}
.srv input:focus{outline:2px solid var(--mustard);outline-offset:1px}
.pads code{font-family:var(--pixel);font-size:9px;color:var(--mustard)}
.padgrid kbd{margin-right:2px}
.sheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px}
.col{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0}
.col h2{font-family:var(--pixel);font-size:10px;letter-spacing:.06em;color:var(--mustard);margin:0 0 12px;line-height:1.6;font-weight:400}
.col ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.col li b{font-weight:400;color:var(--cream);font-size:22px}
.col li span{display:block;color:var(--muted)}
.col li i{font-style:normal;color:var(--slime)}
.swatch{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:8px;vertical-align:1px}
.todo{color:var(--muted);border-top:2px dashed var(--line);padding-top:12px;margin-top:12px}
.todo b{color:var(--cream);font-weight:400}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">

  <div class="screen"><canvas id="game" width="1152" height="648" tabindex="0" aria-label="The Last Video Store game screen"></canvas></div>

  <div class="pad" id="pad" aria-hidden="true">
    <div class="dpad" id="dpad"></div>
    <button class="startbtn" data-act="start">START</button>
    <button class="startbtn gearbtn" data-act="inv">GEAR</button>
    <div class="btns">
      <button data-act="spec">SPEC</button>
      <button data-act="jump">JUMP</button>
      <button data-act="atk">HIT</button>
    </div>
  </div>

  <div hidden>
    <input id="server" type="url" value="https://latefees.prestonmcgill.workers.dev" placeholder="https://latefees.prestonmcgill.workers.dev" autocomplete="off" spellcheck="false">
    <ul id="padlist"></ul><p id="padnote"></p><div id="legend"></div>
  </div>
</div>

<script src="art/manifest.js?v=2026.11.02-3"></script>
<script src="game-core.js?v=2026.11.02-3"></script>
<script>
(()=>{
const {W,H,TOP,BOT,LEVEL_END,LEVELS,NSTAGES}=LFCore;
// Stage progress: the furthest stage reached is unlocked in the lobby's stage picker.
const STG={max:1,cur:1};try{STG.max=Math.max(1,Math.min(NSTAGES,+localStorage.getItem('lfotd-stage')||1));STG.cur=STG.max;}catch(e){}
// Difficulty picked on the title screen (left/right on START). Online, the host's choice is used.
const DIFFS=LFCore.DIFFS;let DIFFSEL='normal';try{const d=localStorage.getItem('lfotd-diff');if(DIFFS.includes(d))DIFFSEL=d;}catch(e){}
function setDiff(d){DIFFSEL=d;try{localStorage.setItem('lfotd-diff',d);}catch(e){}}
function unlockTo(n){n=Math.min(NSTAGES,n);if(n>STG.max){STG.max=n;try{localStorage.setItem('lfotd-stage',n);}catch(e){}}}
const TOTAL_SURV=LEVELS.reduce((a,_,i)=>a+LFCore.survFor(i+1).length,0);
const zoneAt=(L,x)=>{const z=LFCore.levelZones(L);let i=0;while(i<z.length-1&&x>=z[i][2])i++;return i;};
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
// Render scale follows the size the canvas is shown at (sharp on big screens), from 2x to 6x the 384x216 game.
let SC=3;
function fitCanvas(){const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1,k=Math.max(2,Math.min(6,Math.round((r.width||W*3)*dpr/W)));
  if(cv.width!==W*k){SC=k;cv.width=W*k;cv.height=H*k;}ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';}
fitCanvas();addEventListener('resize',fitCanvas);
const {clamp,lerp,rnd,pick}=LFCore;
const touchMode=matchMedia('(hover:none) and (pointer:coarse)').matches;
const C=LFCore;const {PCOL,HEROES,POW,POWKEYS,EN,WAVES,SURV,FIXED_PICKS,CATS,CAT_NAME,RAR,STAT,STAT_KEYS,CAP,POOL,SETS,SET_OF,BASES,BASE_LIST,BAG_MAX,ITEMCOL,setSize,makeItem,rollRarity,emptyGear,cleanItem,bonusTxt,hasPow}=C;

/* ---------- input: two keyboard halves, touch (as keyboard 1), any number of Bluetooth/USB controllers ---------- */
const ks={kb1:{},kb2:{},kb3:{},kb4:{},menu:{}},pv={kb1:{},kb2:{},kb3:{},kb4:{},menu:{}};
const pads={};          // 'gp<index>' -> {name, std, gp} for every controller the browser currently reports
let padBlocked=false,toasts=[];
const devs=()=>['kb1','kb2','kb3','kb4',...Object.keys(pads)];
function ensure(d){if(!ks[d]){ks[d]={};pv[d]={};}}
/* ---------- per-player bindings (saved in this browser) ---------- */
const ACTS=['up','down','left','right','atk','jump','spec','start','inv'];
const PAD_ACTS=['atk','jump','spec','start','inv'];
const ACT_NAME={up:'UP',down:'DOWN',left:'LEFT',right:'RIGHT',atk:'HIT',jump:'JUMP',spec:'SPECIAL',start:'START',inv:'GEAR'};
const DEF_KB=[{up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD',atk:'KeyJ',jump:'KeyK',spec:'KeyL',start:'Enter',inv:'KeyI'},
  {up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight',atk:'Comma',jump:'Period',spec:'Slash',start:'ShiftRight',inv:'Quote'},{},{}];
const DEF_PAD={atk:[2,7],jump:[0],spec:[1,3,5],start:[9],inv:[8]};
const cloneDefPad=()=>JSON.parse(JSON.stringify(DEF_PAD));
let BIND={kb:DEF_KB.map(o=>({...o})),pad:[0,1,2,3].map(cloneDefPad)};
try{const sv=JSON.parse(localStorage.getItem('lfotd-binds')||'null');
  if(sv&&Array.isArray(sv.kb)&&sv.kb.length===4&&Array.isArray(sv.pad)&&sv.pad.length===4)
    BIND={kb:sv.kb.map(o=>Object.fromEntries(ACTS.filter(a=>o&&typeof o[a]==='string').map(a=>[a,o[a]]))),
      pad:sv.pad.map(o=>Object.fromEntries(PAD_ACTS.map(a=>[a,o&&Array.isArray(o[a])&&o[a].length&&o[a].every(Number.isInteger)?o[a]:DEF_PAD[a].slice()])))};}catch(e){}
// Older saves predate the GEAR key: hand out the default if nobody uses it.
BIND.kb.forEach((set,i)=>{const d=DEF_KB[i].inv;if(d&&!set.inv&&!BIND.kb.some(q=>Object.values(q).includes(d)))set.inv=d;});
let KEYMAP={};
function rebuildKeys(){KEYMAP={};BIND.kb.forEach((set,i)=>{for(const a in set){const c=set[a];if(c)(KEYMAP[c]=KEYMAP[c]||[]).push(['kb'+(i+1),a]);}});
  for(let i=1;i<=4;i++)for(const k in ks['kb'+i])ks['kb'+i][k]=false;}
function saveBinds(){try{localStorage.setItem('lfotd-binds',JSON.stringify(BIND));}catch(e){}rebuildKeys();renderLegend();}
function resetPlayer(i){BIND.kb[i]={...DEF_KB[i]};for(let j=0;j<4;j++)if(j!==i)for(const a in BIND.kb[j])if(Object.values(BIND.kb[i]).includes(BIND.kb[j][a]))delete BIND.kb[j][a];BIND.pad[i]=cloneDefPad();}
const KEYN={ArrowUp:'UP',ArrowDown:'DOWN',ArrowLeft:'LEFT',ArrowRight:'RIGHT',Comma:',',Period:'.',Slash:'/',Semicolon:';',Quote:"'",BracketLeft:'[',BracketRight:']',
  Backslash:'\\',Minus:'-',Equal:'=',Backquote:'`',Space:'SPACE',Enter:'ENTER',ShiftLeft:'L-SHIFT',ShiftRight:'R-SHIFT',ControlLeft:'L-CTRL',ControlRight:'R-CTRL',
  AltLeft:'L-ALT',AltRight:'R-ALT',NumpadEnter:'NUM ENT',Tab:'TAB',CapsLock:'CAPS',Delete:'DEL',Insert:'INS',PageUp:'PG UP',PageDown:'PG DN'};
function keyName(c){if(!c)return '--';return KEYN[c]||c.replace(/^Key/,'').replace(/^Digit/,'').replace(/^Numpad/,'NUM ').toUpperCase().slice(0,8);}
const BTN=['A','B','X','Y','LB','RB','LT','RT','SELECT','START','L3','R3','UP','DOWN','LEFT','RIGHT','HOME'];
const btnName=i=>BTN[i]||('BTN'+i);
// Menu keys work no matter how players have remapped their gameplay keys.
const MK={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Enter:'ok',KeyJ:'ok',Escape:'back',Backspace:'back',Delete:'clear'};
let cap=null; // the binding currently waiting for a key or button
function assignKey(p,act,c){
  const old=BIND.kb[p][act];
  BIND.kb.forEach((set,i)=>{for(const a of Object.keys(set))if(set[a]===c&&!(i===p&&a===act)){
    if(i===p){if(old)set[a]=old;else delete set[a];}
    else{delete set[a];toast(keyName(c)+' TAKEN FROM P'+(i+1)+' '+ACT_NAME[a],'#ffc93c');}}});
  BIND.kb[p][act]=c;saveBinds();toast('P'+(p+1)+' '+ACT_NAME[act]+' = '+keyName(c),PCOL[p]);beep(880,.1);
}
function assignPad(p,act,i){
  const m=BIND.pad[p],old=m[act].filter(x=>x!==i);
  for(const a of PAD_ACTS)if(a!==act&&m[a].includes(i)){m[a]=m[a].filter(x=>x!==i);if(!m[a].length)m[a]=old.length?old:[];}
  m[act]=[i];saveBinds();toast('P'+(p+1)+' PAD '+ACT_NAME[act]+' = '+btnName(i),PCOL[p]);beep(880,.1);
}
addEventListener('keydown',e=>{
  if(scene==='join'&&!NET.busy&&!e.repeat){const k=e.key.toUpperCase();
    if(k.length===1&&AZ.includes(k)){NET.codeIn[NET.col]=k;NET.col=Math.min(3,NET.col+1);e.preventDefault();return;}
    if(e.key==='Backspace'){NET.col=Math.max(0,NET.col-1);NET.codeIn[NET.col]='A';e.preventDefault();return;}
    if(k.length===1&&/[A-Z0-9]/.test(k)){e.preventDefault();return;}}
  if(cap){if(cap.kind==='kb'||e.code==='Escape'){e.preventDefault();if(e.repeat)return;
    if(e.code==='Escape'){cap=null;beep(220,.1);return;}
    if(e.code==='KeyM'||/^(Meta|OS|F\d)/.test(e.code)){toast(e.code==='KeyM'?'M IS THE MUTE KEY':'PICK ANOTHER KEY','#ff7a5a');return;}
    assignKey(cap.p,cap.act,e.code);cap=null;return;}}
  let used=false;const m=KEYMAP[e.code];
  if(m){for(const [d,a] of m)ks[d][a]=true;used=true;}
  if(MK[e.code]){ks.menu[MK[e.code]]=true;used=true;}
  if(e.code==='KeyM'&&!e.repeat){muted=!muted;saveSound();toast(muted?'SOUND OFF':'SOUND ON','#d9a87c');used=true;}
  if(used){e.preventDefault();audioInit();}});
addEventListener('keyup',e=>{const m=KEYMAP[e.code];if(m)for(const [d,a] of m)ks[d][a]=false;if(MK[e.code])ks.menu[MK[e.code]]=false;});
addEventListener('blur',()=>{for(const d of ['kb1','kb2','kb3','kb4','menu'])for(const k in ks[d])ks[d][k]=false;});
addEventListener('gamepadconnected',()=>{});addEventListener('gamepaddisconnected',()=>{});
const DIRS=new Set(['left','right','up','down']);
function joined(d){if(scene==='select')return !!slotOf(d);return !!(G&&G.ps.some(p=>p.dev===d));}
// When nobody is playing on the right half of the keyboard, the arrow keys also steer player 1.
function raw(st,d,a){let v=st[d][a];if(d==='kb1'&&DIRS.has(a)&&!joined('kb2'))v=v||st.kb2[a];return !!v;}
const held=(d,a)=>raw(ks,d,a), hit=(d,a)=>raw(ks,d,a)&&!raw(pv,d,a);
const isPad=d=>d.startsWith('gp');
// Menu actions: controllers confirm with A / X / Start and back out with B; keyboards confirm with hit/start and back out with jump.
const okHit=d=>isPad(d)?hit(d,'ok'):hit(d,'atk')||hit(d,'start');
const backHit=d=>isPad(d)?hit(d,'back'):hit(d,'jump');
function menuHit(a){if(hit('menu',a))return true;const ds=devs();
  if(a==='ok')return ds.some(okHit);if(a==='back')return ds.some(backHit);if(a==='clear')return ds.some(d=>isPad(d)&&hit(d,'clear'));
  return ds.some(d=>hit(d,a));}
function padName(id){let s=String(id||'Controller').replace(/\s*\(.*$/,'').replace(/^[0-9a-f]{1,4}-[0-9a-f]{1,4}-/i,'').trim();return (s||'Controller').slice(0,34);}
function padLabel(d){return isPad(d)?'PAD'+(+d.slice(2)+1):d==='kb1'&&touchMode?'TOUCH':'KEYS'+d.slice(2);}
function padMap(d){let slot=-1;if(scene==='select'){const s=slotOf(d);if(s)slot=s.pi;}else if(G){const p=G.ps.find(q=>q.dev===d);if(p)slot=p.slot;}return slot>=0?BIND.pad[slot]:DEF_PAD;}
function toast(s,c='#ffe9c2'){toasts.push({s,c,t:180});if(toasts.length>3)toasts.shift();}
function readPad(gp,s,map){
  const b=j=>{const x=gp.buttons[j];return !!x&&(x.pressed||x.value>.5);};
  let ax=gp.axes[0]||0,ay=gp.axes[1]||0;if(Math.hypot(ax,ay)<.35){ax=0;ay=0;}
  let L=b(14),R=b(15),U=b(12),D=b(13);
  if(gp.mapping!=='standard'){ // many Bluetooth pads without a standard mapping report the d-pad as a hat switch on axis 9
    const h=gp.axes[9];if(h!==undefined&&h>=-1.05&&h<=1.05&&Math.abs(h)>.05){const i=((Math.round((h+1)/(2/7))%8)+8)%8;
      U=U||i===7||i<=1;R=R||(i>=1&&i<=3);D=D||(i>=3&&i<=5);L=L||(i>=5&&i<=7);}}
  s.left=ax<-.45||L;s.right=ax>.45||R;s.up=ay<-.45||U;s.down=ay>.45||D;
  const any=arr=>arr.some(b);
  s.jump=any(map.jump);s.atk=any(map.atk);s.spec=any(map.spec);
  const ns=gp.mapping!=='standard';

function playVoice(src,kind,title,fallback){

  const done=()=>{if(MUS.jingle===j){MUS.jingle=null;MUS.jk=null;MUS.jtitle=null;}};
  const fail=()=>{if(MUS.jingle!==j)return;done();if(fallback)fallback();};
  j.onended=done;j.onerror=fail;
  if(title)j.onplaying=()=>{if(MUS.jingle===j&&scene==='play')toast('96.9 FM  '+title,'#ffc93c');};
  const pr=j.play();if(pr&&pr.catch)pr.catch(e=>{if(e&&e.name==='NotAllowedError')done();else fail();});
  setTimeout(done,kind==='start'&&title?150000:20000);
}

function rrect(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);ctx.fill();}
// 90s cinema/rental-store carpet: confetti squiggles, triangles and dots on deep plum, built once as a repeating tile
let CARPET=null;
function carpetPat(){
  if(CARPET)return CARPET;
  const c=document.createElement('canvas');c.width=64;c.height=64;const x=c.getContext('2d');
  x.fillStyle='#24101c';x.fillRect(0,0,64,64);
  const cols=['#3ad6c0','#ff5fa8','#ffc93c','#7a4adf'];let s=7;const r=()=>{s=(s*9301+49297)%233280;return s/233280;};
  for(let i=0;i<10;i++){const px=r()*64,py=r()*64,col=cols[i%4];x.globalAlpha=.55;x.fillStyle=col;x.strokeStyle=col;x.lineWidth=1.5;
    const k=i%3;if(k===0){x.beginPath();x.moveTo(px,py);x.quadraticCurveTo(px+4,py-4,px+8,py);x.quadraticCurveTo(px+12,py+4,px+16,py);x.stroke();}
    else if(k===1){x.beginPath();x.moveTo(px,py);x.lineTo(px+5,py-6);x.lineTo(px+9,py+1);x.closePath();x.fill();}
    else{x.beginPath();x.arc(px,py,1.6,0,7);x.fill();}}
  x.globalAlpha=1;CARPET=ctx.createPattern(c,'repeat');return CARPET;
}
// sunburst stripes like the page header
function sunburst(x0,y0,w,h,a='#c43a2a',b='#e8663a',spin=0){
  ctx.save();ctx.beginPath();ctx.rect(x0,y0,w,h);ctx.clip();rect(x0,y0,w,h,a);ctx.fillStyle=b;
  const cx=x0+w/2,cy=y0+h*3.2,R=w+h*4;
  for(let i=0;i<36;i+=2){const t0=(i/36)*Math.PI*2+spin,t1=((i+1)/36)*Math.PI*2+spin;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(t0)*R,cy+Math.sin(t0)*R);ctx.lineTo(cx+Math.cos(t1)*R,cy+Math.sin(t1)*R);ctx.closePath();ctx.fill();}
  ctx.restore();
}

/* ---------- lobby (character select) ---------- */
const L={slots:[],cd:0,last:-1};
function lobbyReset(){L.slots=[];L.cd=0;L.last=-1;}
function slotOf(d){return L.slots.find(s=>s.dev===d);}
function takenBy(h,except){return L.slots.some(s=>s!==except&&s.locked&&s.cur===h);}
function lobbyJoin(d){
  if(L.slots.length>=4||slotOf(d))return;
  let pi=0;while(L.slots.some(s=>s.pi===pi))pi++;
  if(!isPad(d)){const pref=+d.slice(2)-1;if(!L.slots.some(s=>s.pi===pref))pi=pref;}
  let c=0;for(let i=0;i<4;i++){if(!takenBy(i)&&!L.slots.some(s=>s.cur===i)){c=i;break;}}
  L.slots.push({dev:d,pi,cur:c,locked:false});L.last=L.slots.length-1;L.cd=0;beep(520+pi*80,.1);
}
function updSelect(){
  for(const d of devs()){const s=slotOf(d);
    if(!s){if(okHit(d)){lobbyJoin(d);rumble(d,.4,150);}continue;}
    if(!s.locked){
      const mv=(hit(d,'right')?1:0)-(hit(d,'left')?1:0);
      if(mv){for(let i=0;i<4;i++){s.cur=(s.cur+mv+4)%4;if(!takenBy(s.cur,s))break;}L.last=L.slots.indexOf(s);beep(440,.05);}
      if(okHit(d)&&!takenBy(s.cur,s)){s.locked=true;L.last=L.slots.indexOf(s);beep(880,.12,'square',.05,.5);rumble(d,.6,120);}
      else if(backHit(d)){L.slots.splice(L.slots.indexOf(s),1);L.last=L.slots.length-1;beep(220,.1);}
    }else if(backHit(d)){s.locked=false;L.cd=0;}
  }
  if(hit('menu','back')||(!L.slots.length&&devs().some(d=>isPad(d)&&hit(d,'back')))){lobbyReset();scene='title';beep(330,.08);}
  if(STG.max>1&&!L.cd){const mv=(menuHit('down')?1:0)-(menuHit('up')?1:0);if(mv){STG.cur=(STG.cur-1+mv+STG.max)%STG.max+1;beep(600,.05);}}
  if(L.slots.length&&L.slots.every(s=>s.locked)){if(++L.cd>75){newGame();scene='intro';introT=0;}}else L.cd=0;
}

/* ---------- game setup: the shared core runs the rules, this file feeds it inputs and shows its events ---------- */
const FX={parts:[],texts:[]};let shakeV=0;
const active=()=>G?C.active(G):[];
function playerSpec(slot,hero){return {slot,hero,st:calcStats(HEROES[hero].id),look:gearLook(HEROES[hero].id)};}
function newGame(){
  const slots=L.slots.slice().sort((a,b)=>a.pi-b.pi);
  G=C.newGame(slots.map(s=>playerSpec(s.pi,s.cur)),STG.cur,DIFFSEL);
  slots.forEach(s=>{const p=G.ps.find(q=>q.slot===s.pi);if(p)p.dev=s.dev;});
  FX.parts=[];FX.texts=[];shakeV=0;G.endT=0;
}
const ACT7=['up','down','left','right','atk','jump','spec','start'];
function feedInputs(){
  for(const p of G.ps){if(!p.dev||p.lostPad){p.in={};continue;}const d=p.dev,o={};for(const a of ACT7)o[a]=held(d,a);p.in=o;}
}
function dropIn(){
  const g=G;
  for(const d of devs()){
    if(g.ps.some(q=>q.dev===d))continue;
    const want=isPad(d)?okHit(d):d==='kb1'?hit(d,'start'):hit(d,'start')||hit(d,'atk'); // J on the left keyboard never joins by accident
    if(!want)continue;
    if(claimLost(d))continue;
    if(g.ps.length>=4)continue;
    let slot=0;while(g.ps.some(q=>q.slot===slot))slot++;
    const np=C.addPlayer(g,{slot});if(!np)continue;
    np.dev=d;applyGear(np,true);rumble(d,.5,160);renderPadList();
  }
}
function localStep(){
  feedInputs();dropIn();C.step(G);drainEvents(G.ev);
  stageProgress();
  if(G.status==='over'){scene='over';G.endT=0;saveHi();}else if(G.status==='win'){scene='win';G.endT=0;saveHi();}
}
function stageProgress(){if(!G)return;unlockTo((G.level||1)+(G.status==='clear'||G.status==='win'?1:0));if(G.status==='over'||G.status==='clear')STG.cur=Math.min(STG.max,G.level+(G.status==='clear'?1:0));}
function devOfSlot(slot){const p=G&&G.ps.find(q=>q.slot===slot);return p?p.dev:null;}
function sparksAt(x,y,z,n=6,cols=['#ffffff','#ffc93c','#ff9a3c']){for(let i=0;i<n;i++)FX.parts.push({x,y,z,vx:rnd(-2,2),vy:rnd(-.5,.5),vz:rnd(-1,2.5),t:rnd(8,16),c:cols[i%cols.length],s:2,g:.15});}
function drainEvents(list){
  for(const e of list){
    switch(e.t){
    case 'beep':if(e.dl)setTimeout(()=>beep(e.f,e.d,e.ty,e.v,e.sl),e.dl);else beep(e.f,e.d,e.ty,e.v,e.sl);break;
    case 'rumble':{const d=devOfSlot(e.slot);if(d)rumble(d,e.str,e.ms);break;}
    case 'toast':toast(e.s,e.c);break;
    case 'stage':FX.parts=[];FX.texts=[];shakeV=0;break;
    case 'text':FX.texts.push({x:e.x,y:e.y,z:e.z,s:e.s,c:e.c,t:60});break;
    case 'shake':shakeV=Math.max(shakeV,e.v);break;
    case 'fx':
      if(e.k==='sparks')sparksAt(e.x,e.y,e.z,e.n,e.c||undefined);
      else if(e.k==='goo')sparksAt(e.x,e.y,e.z,e.n,['#c8f05a','#9ccf3a','#eaff9a']);
      else if(e.k==='smoke')FX.parts.push({x:e.x,y:e.y,z:e.z,vx:rnd(-.3,.3),vy:0,vz:.6,t:24,c:'#8a8496',s:3,g:0});
      else FX.parts.push({x:e.x,y:e.y,z:e.z,vx:e.vx||0,vy:e.vy||0,vz:e.vz||0,t:e.l||10,c:e.c,s:e.s||2,g:e.gv||0});
      break;
    case 'loot':{const p=G.ps.find(q=>q.slot===e.slot);if(p&&(!NET.on||e.slot===NET.slot))onLoot(p,e.item,e.x,e.y);break;}
    case 'gearhint':{const p=G.ps.find(q=>q.slot===e.slot);if(p&&p.dev)toast('P'+(p.slot+1)+': '+invKeyLabel(p)+' OPENS GEAR',PCOL[p.slot]);break;}
    }
  }
  list.length=0;
}
function updateFX(){
  shakeV*=.86;
  for(const q of FX.parts){q.x+=q.vx;q.y+=q.vy;q.z+=q.vz;q.vz-=q.g;if(q.z<0){q.z=0;q.vx*=.6;}q.t--;}
  FX.parts=FX.parts.filter(q=>q.t>0);
  for(const t of FX.texts){t.z+=.45;t.t--;}FX.texts=FX.texts.filter(t=>t.t>0);
}

/* ---------- online: rooms on a Cloudflare Durable Object ---------- */
const NET={on:false,ws:null,code:'',slot:-1,token:null,dev:'kb1',lobby:null,snapMs:50,lastSnap:0,err:'',busy:false,held:0,sendT:0,cur:0,codeIn:['A','A','A','A'],col:0,ready:false,gone:false,tries:0};
const serverEl=document.getElementById('server');
const DEFAULT_SERVER='https://latefees.prestonmcgill.workers.dev';
try{serverEl.value=localStorage.getItem('lfotd-server')||DEFAULT_SERVER;}catch(e){serverEl.value=DEFAULT_SERVER;}
serverEl.addEventListener('change',()=>{try{localStorage.setItem('lfotd-server',serverEl.value.trim());}catch(e){}});
function serverBase(){let u=(serverEl.value||'').trim().replace(/\/+$/,'')||DEFAULT_SERVER;if(u&&!/^https?:\/\//.test(u))u='https://'+u;return u;}
const BITS={up:1,down:2,left:4,right:8,atk:16,jump:32,spec:64,start:128};
function netSend(o){if(NET.ws&&NET.ws.readyState===1)NET.ws.send(JSON.stringify(o));}
function myGear(){const h=NET.lobby&&NET.lobby.players.find(p=>p.s===NET.slot);const hid=h?HEROES[h.h].id:(G&&G.ps.find(p=>p.slot===NET.slot)||{ch:HEROES[0]}).ch.id;return {st:calcStats(hid),look:gearLook(hid)};}
async function netHost(){
  const base=serverBase();if(!base){NET.err='SET THE SERVER ADDRESS BELOW THE GAME';return;}
  NET.busy=true;NET.err='';
  try{const r=await fetch(base+'/rooms',{method:'POST'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();netJoin(j.code);}
  catch(e){NET.err='COULD NOT REACH SERVER';NET.busy=false;}
}
function netJoin(code){
  const base=serverBase();if(!base){NET.err='SET THE SERVER ADDRESS BELOW THE GAME';return;}
  NET.busy=true;NET.err='';NET.code=code.toUpperCase();NET.gone=false;
  let ws;try{ws=new WebSocket(base.replace(/^http/,'ws')+'/rooms/'+NET.code+'/ws');}catch(e){NET.err='BAD SERVER ADDRESS';NET.busy=false;return;}
  NET.ws=ws;
  ws.onopen=()=>{NET.tries=0;netSend({t:'join',token:NET.token,name:'P',...myGear()});};
  ws.onmessage=m=>{let d;try{d=JSON.parse(m.data);}catch(e){return;}netMsg(d);};
  ws.onclose=()=>{if(NET.ws!==ws)return;NET.ws=null;
    if(NET.gone){netLeave(true);return;}
    if(NET.on&&(scene==='play'||scene==='pause'||scene==='inv'||scene==='intro')&&NET.tries<8){NET.tries++;toast('CONNECTION LOST, RECONNECTING','#ff7a5a');setTimeout(()=>{if(!NET.ws&&NET.on)netJoin(NET.code);},1000*Math.min(5,NET.tries));}
    else{if(NET.busy&&!NET.err)NET.err='ROOM NOT FOUND';netLeave(true);}};
  ws.onerror=()=>{if(NET.busy&&!NET.err)NET.err='COULD NOT CONNECT';};
}
function netLeave(silent){
  const ws=NET.ws;NET.gone=true;NET.ws=null;if(ws){try{ws.send(JSON.stringify({t:'leave'}));}catch(e){}try{ws.close();}catch(e){}}
  NET.on=false;NET.busy=false;NET.lobby=null;NET.slot=-1;
  if(scene!=='title'&&scene!=='online'&&scene!=='join'){scene='online';NET.cur=0;}
  if(!silent)toast('LEFT THE ROOM','#d9a87c');
}
function netMsg(d){
  switch(d.t){
  case 'welcome':NET.slot=d.slot;NET.token=d.token;NET.code=d.code;NET.busy=false;NET.on=true;NET.err='';
    NET.serverCore=d.core||'OLD';if(NET.serverCore!==C.CORE_VERSION)toast('ROOM SERVER IS OUT OF DATE: REDEPLOY IT','#ff7a5a');
    if(scene==='online'||scene==='join')scene='nlobby';break;
  case 'lobby':NET.lobby=d;if(scene==='play'||scene==='pause'||scene==='inv'||scene==='over'||scene==='win'||scene==='intro'){if(d.status==='lobby'){scene='nlobby';G=null;}}
    else if(scene==='nlobby'&&d.status!=='lobby'){scene='play';toast('JOINED A GAME IN PROGRESS','#3ad6c0');}break;
  case 'start':G=null;FX.parts=[];FX.texts=[];shakeV=0;scene='intro';introT=0;NET.ready=false;break;
  case 'snap':{if(!G)G={ps:[],enemies:[],proj:[],pick:[],surv:[],waves:[],ev:[],net:true,endT:0};
    G.now=performance.now();C.applySnapshot(G,d.s);NET.lastSnap=G.now;
    const me=G.ps.find(p=>p.slot===NET.slot);if(me)me.dev=NET.dev;
    if(d.ev&&d.ev.length)drainEvents(d.ev);
    if((scene==='intro'&&introT>60)||scene==='nlobby')scene='play';
    stageProgress();
    if(G.status==='over'&&scene!=='over'){scene='over';G.endT=0;saveHi();}
    if(G.status==='win'&&scene!=='win'){scene='win';G.endT=0;saveHi();}
    break;}
  case 'err':NET.err=d.msg||'ERROR';NET.busy=false;toast(NET.err,'#ff7a5a');break;
  case 'kick':toast(d.msg||'REMOVED FROM ROOM','#ff7a5a');netLeave(true);break;
  }
}
function netTick(){
  if(!NET.ws||NET.ws.readyState!==1||NET.slot<0)return;
  const d=NET.dev,blocked=scene==='pause'||scene==='inv'||scene==='controls';
  let h=0,p=0;if(!blocked)for(const a in BITS){if(held(d,a))h|=BITS[a];if(hit(d,a))p|=BITS[a];}
  NET.sendT++;
  if(p||h!==NET.held||NET.sendT>=30){netSend({t:'in',h,p});NET.held=h;NET.sendT=0;}
}
function updOnline(){
  if(NET.busy){if(menuHit('back')){netLeave(true);}return;}
  if(menuHit('up')){NET.cur=(NET.cur+2)%3;beep(440,.05);}if(menuHit('down')){NET.cur=(NET.cur+1)%3;beep(440,.05);}

    const ip=G.ps.find(p=>!p.out&&!p.lostPad&&p.dev&&hit(p.dev,'inv'));

      else if(menuHit('ok')||G.ps.some(p=>!p.lostPad&&p.dev&&hit(p.dev,'start'))){const d=devs().find(okHit),who=d&&G.ps.find(q=>q.dev===d);
        if(pCur===0)scene='play';else if(pCur===1)openInv(NET.on?G.ps.find(q=>q.slot===NET.slot):who&&!who.out?who:active()[0]||G.ps[0],'pause');else if(pCur===2)openControls('pause',who?who.slot:0);else if(pCur===3)openSound('pause');else if(pCur===4)openGuide('pause');

    if(d){if(NET.on){netSend({t:'again'});}else{lobbyReset();lobbyJoin(d);scene='select';}}}
  for(const d of [...devs(),'menu']){ensure(d);Object.assign(pv[d],ks[d]);}
}

// word-wrap for the 8px pixel font (8px per character)
function wrapLines(s,maxCh){const out=[];let line='';for(const w of String(s).split(' ')){if((line+(line?' ':'')+w).length>maxCh){if(line)out.push(line);line=w;}else line+=(line?' ':'')+w;}if(line)out.push(line);return out;}
