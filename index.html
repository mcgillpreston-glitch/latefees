<title>The Last Video Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: one arcade-cabinet column. VHS-sleeve marquee, the screen, controls, then a rental-box-back design sheet. */
:root{
  color-scheme: dark;
  --bg:#2b150f; --panel:#45221a; --line:#7a3f26; --cream:#ffe9c2; --muted:#d9a87c;
  --orange:#ff9a3c; --red:#e8453c; --slime:#c8f05a; --pink:#ff5fa8; --teal:#3ad6c0; --mustard:#ffc93c;
  --p1:#ff5a4a; --p2:#3ad6c0; --p3:#c8f05a; --p4:#ffc93c;
  --display:'Bungee', Impact, 'Arial Black', sans-serif;
  --pixel:'Press Start 2P', ui-monospace, monospace;
  --body:'VT323', ui-monospace, 'Courier New', monospace;
  --sk-shell:#262630;--sk-hi:#3b3b47;--sk-lo:#121216;--sk-edge:#07070a;--sk-btn:#e8453c;--sk-btn-hi:#ff8f7e;--sk-btn-lo:#7a1d16;--sk-dpad:#15151a;--sk-dpad-hi:#2c2c34;--sk-pill:#3d3d48;--sk-pill-hi:#5c5c69;--sk-pill-lo:#141418;--sk-print:#ffe9c2;--sk-btn-txt:#ffe9c2;--sk-pill-txt:#ffe9c2;--sk-led:#ff3b30;--sk-acc1:#ffc93c;--sk-acc2:#3ad6c0;
}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{color:var(--cream);background:radial-gradient(ellipse 120% 60% at 50% -10%,#6a2a1a 0%,var(--bg) 60%)}
body{
  font-family:var(--body);font-size:20px;line-height:1.25;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:8px;margin:0;
}
html,body{height:100%}
body{box-sizing:border-box;overflow-x:hidden}
/* Handheld shell. On phones the game sits in a pocket console: screen bezel, cross d-pad, diagonal face buttons, slanted
   SELECT/START pills, speaker grille. Its colours come from the SKIN picked in SETTINGS (set as --sk-* on <html>). */
.wrap{margin:0 auto;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.shell{position:relative;width:min(100%,calc((100vh - 40px) * 16 / 9));box-sizing:border-box}
.bezel{position:relative;background:#232329;border:6px solid var(--sk-shell);border-radius:8px;box-shadow:0 0 0 3px var(--sk-lo),0 0 0 6px var(--sk-acc1),0 24px 50px rgba(0,0,0,.55)}
.screen{background:#000;overflow:hidden}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:auto;cursor:pointer;outline:none}
canvas:focus-visible{box-shadow:0 0 0 3px var(--orange)}
.bz-top,.bz-bot,.pad,.board,.ticker,.lcd,.ant,.glass,.model{display:none}
.pad{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@media (hover:none) and (pointer:coarse){
  body{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .kbd-only{display:none}
  .shell{width:min(100%,calc((100vh - 330px) * 16 / 9));width:min(100%,calc((100dvh - 330px) * 16 / 9));padding:12px 12px 16px;border-radius:24px;
    background:linear-gradient(170deg,var(--sk-hi) 0%,var(--sk-shell) 16%,var(--sk-shell) 72%,var(--sk-lo) 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.2),inset 0 -5px 0 rgba(0,0,0,.3),0 0 0 2px var(--sk-edge),0 18px 40px rgba(0,0,0,.6)}
  /* ribbed grips down both sides of the control deck */
  .shell::before,.shell::after{content:"";position:absolute;top:56%;bottom:9%;width:7px;z-index:1;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(0,0,0,.32) 0 3px,rgba(255,255,255,.07) 3px 4px,transparent 4px 9px)}
  .shell::before{left:2px;border-radius:12px 0 0 12px}.shell::after{right:2px;border-radius:0 12px 12px 0}
  /* telescoping antenna off the top-right corner (only when the screen has room for it) */
  .ant{position:absolute;right:34px;top:-2px;width:9px;height:96px;transform-origin:50% 100%;transform:rotate(24deg);z-index:0;pointer-events:none}
  .shell.tall .ant{display:block}
  .ant i{position:absolute;left:50%;transform:translateX(-50%);border-radius:2px;background:linear-gradient(90deg,#6f7278,#e6e8ea 45%,#9a9da3 70%,#4d5055);box-shadow:0 0 0 1px rgba(0,0,0,.45)}
  .ant i:nth-child(1){bottom:0;width:9px;height:40px}.ant i:nth-child(2){bottom:36px;width:6.5px;height:36px}.ant i:nth-child(3){bottom:68px;width:4.5px;height:26px}
  .ant b{position:absolute;left:50%;top:-6px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f2f3f4,#7a7d83 70%);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
  /* translucent skins show a circuit board through the case */
  .board{position:absolute;inset:0;z-index:0;border-radius:inherit;background:
    radial-gradient(circle at 20% 70%,rgba(255,220,120,.35) 0 2px,transparent 3px),radial-gradient(circle at 70% 55%,rgba(255,220,120,.35) 0 2px,transparent 3px),
    repeating-linear-gradient(0deg,transparent 0 22px,rgba(230,200,120,.22) 22px 23px),repeating-linear-gradient(90deg,transparent 0 30px,rgba(230,200,120,.22) 30px 31px),
    linear-gradient(#143a2a,#0d2a1e)}
  .board::after{content:"";position:absolute;inset:0;background:linear-gradient(170deg,var(--sk-hi) 0%,var(--sk-shell) 18%,var(--sk-shell) 70%,var(--sk-lo) 100%)}
  .shell>*:not(.board):not(.ant){position:relative;z-index:1}
  .bezel{border:0;background:linear-gradient(180deg,#1c1e24,#101217 30%,#0b0c10);border-radius:18px;padding:8px 12px 8px;box-shadow:inset 0 2px 6px rgba(0,0,0,.8),inset 0 -1px 0 rgba(255,255,255,.06),0 0 0 2px #2b2e35,0 1px 0 rgba(255,255,255,.12)}
  .screen{position:relative;border-radius:10px;box-shadow:0 0 0 1px #000,0 0 16px rgba(0,0,0,.9)}
  .glass{display:block;position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.035) 16%,transparent 30%),radial-gradient(ellipse at 50% 50%,transparent 72%,rgba(0,0,0,.2) 100%);box-shadow:inset 0 0 12px rgba(0,0,0,.6)}
  .lab{display:block;height:var(--lh,7px);width:auto;fill:currentColor;color:var(--sk-print);flex:none}
  .bz-top{display:flex;align-items:center;gap:7px;height:18px;margin:0 2px 8px;color:#b4b8c2;--lh:5.5px}
  .bz-top .dial{flex:none;position:relative;width:30px;height:11px;margin-left:8px;border-radius:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 1.5px,rgba(0,0,0,.45) 1.5px 3.5px),var(--sk-pill);background-position:calc(var(--vol,.7) * -21px) 0;box-shadow:inset 0 1px 2px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.1);transition:background-position .15s}
  .bz-top .dial::after{content:"";position:absolute;left:0;bottom:-4px;height:2px;width:calc(var(--vol,.7) * 100%);background:var(--vol-col,#ffb347);box-shadow:0 0 3px var(--vol-col,#ffb347);transition:width .15s}
  .bz-top .ch{flex:none;width:40px;height:12px;margin-left:8px;border-radius:2px;background:#15110f;box-shadow:inset 0 1px 3px #000,0 0 0 1px rgba(0,0,0,.4)}
  .bz-top .lab{color:inherit}.bz-top .hifi{margin-left:auto;opacity:.85}
  .bz-top .led{flex:none;margin-right:1px;width:7px;height:7px;border-radius:50%;background:var(--sk-led);box-shadow:0 0 6px var(--sk-led),0 0 2px #fff inset}
  .bz-bot{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:7px;height:14px;color:#dfe1e6}
  .bz-bot .lab[data-l=mark]{--lh:11px;filter:drop-shadow(0 1px 0 #000)}
  .bz-bot .badge{display:flex;align-items:center;height:12px;padding:0 5px;border:1px solid #8c8f96;border-radius:3px;color:#dfe1e6;--lh:5px}
  .pad{display:block;margin-top:12px;padding:12px 8px 10px;border-radius:14px;background:rgba(0,0,0,.14);box-shadow:inset 0 2px 4px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.1)}
  .row{display:flex;justify-content:space-between;align-items:center;padding:0 2px}
  .row.lo{align-items:flex-end;margin-top:4px;min-height:48px}
  .pills{display:flex;justify-content:center;gap:26px;margin:22px 0 2px;padding-left:4px}
  .dpad{--dp:min(32vw,148px);width:var(--dp);height:var(--dp);position:relative;flex:none;border-radius:50%}
  .dpad .dish{position:absolute;inset:3%;border-radius:50%;background:rgba(0,0,0,.2);box-shadow:inset 0 3px 8px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.08)}
  .dpad .knob{display:none}
  .dpad.stick::before,.dpad.stick::after,.dpad.stick i,.dpad.stick s{display:none}
  .dpad.stick .dish{inset:6%;background:radial-gradient(circle at 50% 42%,rgba(0,0,0,.08),rgba(0,0,0,.42) 72%);box-shadow:inset 0 4px 12px rgba(0,0,0,.6),inset 0 -1px 0 rgba(255,255,255,.1)}
  .dpad.stick .knob{display:block;position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;background:radial-gradient(circle at 40% 34%,var(--sk-pill-hi) 0%,var(--sk-pill) 62%);box-shadow:0 4px 0 var(--sk-pill-lo),0 7px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 2px rgba(0,0,0,.25);will-change:transform}
  .dpad.stick .knob::after{content:"";position:absolute;inset:30%;border-radius:50%;background:radial-gradient(circle at 50% 40%,rgba(0,0,0,.4),transparent 70%)}
  .dpad::before,.dpad::after{content:"";position:absolute;background:linear-gradient(180deg,var(--sk-dpad-hi),var(--sk-dpad) 40%);border-radius:6px;box-shadow:0 3px 0 rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.05)}
  .dpad::before{left:33%;top:0;width:34%;height:100%}
  .dpad::after{top:33%;left:0;height:34%;width:100%}
  .dpad i{position:absolute;left:50%;top:50%;width:24%;height:24%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 50% 45%,rgba(0,0,0,.45),rgba(0,0,0,0) 72%);z-index:1}
  .dpad s{position:absolute;left:50%;top:50%;width:0;height:0;border:5px solid transparent;z-index:1;opacity:.35}
  .dpad s.u{border-bottom-color:#fff;transform:translate(-50%,calc(var(--dp) * -.36))}
  .dpad s.d{border-top-color:#fff;transform:translate(-50%,calc(var(--dp) * .3))}
  .dpad s.l{border-right-color:#fff;transform:translate(calc(var(--dp) * -.4),-50%)}
  .dpad s.r{border-left-color:#fff;transform:translate(calc(var(--dp) * .33),-50%)}
  .btns{--bt:min(15.5vw,70px);position:relative;width:calc(var(--bt) * 2.2);height:calc(var(--bt) * 2.15);flex:none;margin-right:2px}
  .btns button{position:absolute;width:var(--bt);height:var(--bt);border-radius:50%;border:0;padding:0;display:flex;align-items:center;justify-content:center;touch-action:none;
    background:radial-gradient(circle at 38% 32%,var(--sk-btn-hi),var(--sk-btn) 58%);box-shadow:0 4px 0 var(--sk-btn-lo),0 7px 10px rgba(0,0,0,.45),inset 0 -2px 0 rgba(0,0,0,.25)}
  .btns button .lab{--lh:calc(var(--bt) * .13);max-width:78%;color:var(--sk-btn-txt);opacity:.92;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
  .lab.off{display:none}
  .btns button.idle,.pill.idle{opacity:.55}
  .btns button[data-act="spec"]{right:0;top:0}
  .btns button[data-act="jump"]{left:0;top:calc(50% - var(--bt) / 2)}
  .btns button[data-act="atk"]{right:0;bottom:0}
  .btns button:active,.btns button.on{transform:translateY(3px);box-shadow:0 1px 0 var(--sk-btn-lo),0 2px 4px rgba(0,0,0,.4),inset 0 -2px 0 rgba(0,0,0,.25)}
  .pill{position:relative;width:min(12.5vw,54px);height:16px;border-radius:8px;border:0;padding:0;display:flex;align-items:center;justify-content:center;transform:rotate(-24deg);touch-action:none;
    background:linear-gradient(180deg,var(--sk-pill-hi),var(--sk-pill) 55%);box-shadow:0 3px 0 var(--sk-pill-lo),inset 0 1px 0 rgba(255,255,255,.2)}
  .pill::before{content:"";position:absolute;inset:-6px -4px}
  .pill .lab{--lh:5px;max-width:80%;color:var(--sk-pill-txt);opacity:.95}
  .pill:active,.pill.on{transform:rotate(-24deg) translateY(2px);box-shadow:0 1px 0 var(--sk-pill-lo),inset 0 1px 0 rgba(255,255,255,.2)}
  .brand{display:flex;align-items:center;gap:8px;color:var(--sk-print);opacity:.85;padding-left:4px;--lh:6px}
  .brand .st{flex:none;width:30px;height:16px;background:linear-gradient(115deg,transparent 0 12%,var(--mustard) 12% 36%,var(--teal) 36% 60%,var(--cream) 60% 78%,transparent 78%)}
  .row.lo{min-height:26px;margin-top:8px;align-items:center}
  .model{display:block;--lh:5px;opacity:.7;margin-right:4px}
  /* VCR-style readout above the console, shown when the screen is tall enough */
  .ticker.on{display:block;width:100%;height:28px;margin:0 0 10px;border-radius:6px;background:#0d0b0b;box-shadow:inset 0 2px 8px rgba(0,0,0,.85),0 0 0 2px #1f2126,0 1px 0 rgba(255,255,255,.12)}
  /* little LCD between the pad and the buttons: your hero, health and what they're wearing */
  .lcd{display:flex;flex:1;align-self:stretch;align-items:center;justify-content:center;min-width:0;padding:0 7px}
  .lcd canvas{display:block;width:100%;max-width:66px;aspect-ratio:40/84;height:auto;border-radius:4px;background:#161a16;box-shadow:inset 0 2px 6px rgba(0,0,0,.8),0 0 0 2px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.1)}
}
/* phones held sideways: a wide pocket TV. Screen in the middle, d-pad with GEAR/START under it on the left,
   the gear LCD over the JUMP/HIT/SPEC triangle on the right. Nothing sits over the picture. */
@media (hover:none) and (pointer:coarse) and (orientation:landscape){
  body{padding-block:4px}
  .shell{width:100%;padding:6px 8px;border-radius:18px;display:grid;column-gap:6px;row-gap:4px;align-items:center;justify-items:center;
    grid-template-columns:minmax(104px,1fr) auto minmax(104px,1fr);grid-template-rows:auto auto auto auto;
    grid-template-areas:"dpad bezel lcd" "dpad bezel btns" "gear bezel btns" "start bezel btns"}
  .shell::before,.shell::after{display:none}
  .bz-top,.bz-bot,.brand,.ticker,.ant,.model{display:none}
  .bezel{grid-area:bezel;width:min(calc((100vh - 36px) * 16 / 9),calc(100vw - 268px));width:min(calc((100dvh - 36px) * 16 / 9),calc(100vw - 268px));padding:6px;border-radius:12px}
  .screen{border-radius:7px}
  .pad,.row,.pills{display:contents}
  .dpad{grid-area:dpad;--dp:104px;align-self:end;margin-bottom:2px}
  .pill[data-act="inv"]{grid-area:gear}.pill[data-act="start"]{grid-area:start}
  .pill{width:52px;height:15px;margin:3px 0}
  .lcd{grid-area:lcd;flex:none;align-self:end;padding:0;margin-bottom:4px}
  .lcd canvas{width:44px;height:92.4px;max-width:none}
  .btns{grid-area:btns;--bt:46px;align-self:start;margin:0}
}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px}
.ctl{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:10px 14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;min-width:0}
.ctl h3{width:100%;margin:0 0 2px;font-family:var(--pixel);font-size:9px;letter-spacing:.06em;font-weight:400;line-height:1.6}
.ctl h3{color:var(--pc,var(--mustard))}
.ctl.note span{color:var(--muted)}
kbd{font-family:var(--pixel);font-size:9px;color:#1c0b07;background:var(--cream);border:1px solid #1c0b07;border-bottom-width:3px;border-radius:4px;padding:4px 6px;margin-right:4px}
.pads{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.padhead{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
.pads h2{font-family:var(--pixel);font-size:10px;letter-spacing:.06em;color:var(--p3);margin:0;line-height:1.6;font-weight:400}
.pads h3{font-family:var(--pixel);font-size:8px;letter-spacing:.06em;color:var(--mustard);margin:0 0 6px;font-weight:400;line-height:1.6}
.padhead p{margin:0;color:var(--muted)}
.padlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px}
.padlist:empty{display:none}
.padlist li{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;background:#331a12;border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-width:0}
.padlist .dot{width:12px;height:12px;border-radius:50%;flex:none}
.padlist b{font-weight:400;color:var(--cream);overflow-wrap:anywhere;min-width:0}
.padlist li>span:last-child{width:100%;padding-left:22px;color:var(--muted)}
.padgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px;color:var(--muted)}
.padgrid b{color:var(--cream);font-weight:400}
.padhead p b{color:var(--cream)}
.srv{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;color:var(--muted)}
.srv input{flex:1;min-width:min(100%,260px);font-family:var(--body);font-size:20px;color:var(--cream);background:#241008;border:2px solid var(--line);border-radius:4px;padding:6px 10px}
.srv input:focus{outline:2px solid var(--mustard);outline-offset:1px}
.pads code{font-family:var(--pixel);font-size:9px;color:var(--mustard)}
.padgrid kbd{margin-right:2px}
.sheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px}
.col{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0}
.col h2{font-family:var(--pixel);font-size:10px;letter-spacing:.06em;color:var(--mustard);margin:0 0 12px;line-height:1.6;font-weight:400}
.col ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.col li b{font-weight:400;color:var(--cream);font-size:22px}
.col li span{display:block;color:var(--muted)}
.col li i{font-style:normal;color:var(--slime)}
.swatch{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:8px;vertical-align:1px}
.todo{color:var(--muted);border-top:2px dashed var(--line);padding-top:12px;margin-top:12px}
.todo b{color:var(--cream);font-weight:400}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">

  <div class="shell" id="shell">
    <div class="board"></div>
    <div class="ant" aria-hidden="true"><i></i><i></i><i></i><b></b></div>

const INK='#1c0b07',PAPER='#f3e6c8';
function rrect(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);ctx.fill();}
// 90s cinema/rental-store carpet: confetti squiggles, triangles and dots on deep plum, built once as a repeating tile
let CARPET=null;
function carpetPat(){
  if(CARPET)return CARPET;
  const c=document.createElement('canvas');c.width=64;c.height=64;const x=c.getContext('2d');
  x.fillStyle='#24101c';x.fillRect(0,0,64,64);
  const cols=['#3ad6c0','#ff5fa8','#ffc93c','#7a4adf'];let s=7;const r=()=>{s=(s*9301+49297)%233280;return s/233280;};
  for(let i=0;i<10;i++){const px=r()*64,py=r()*64,col=cols[i%4];x.globalAlpha=.55;x.fillStyle=col;x.strokeStyle=col;x.lineWidth=1.5;
    const k=i%3;if(k===0){x.beginPath();x.moveTo(px,py);x.quadraticCurveTo(px+4,py-4,px+8,py);x.quadraticCurveTo(px+12,py+4,px+16,py);x.stroke();}
    else if(k===1){x.beginPath();x.moveTo(px,py);x.lineTo(px+5,py-6);x.lineTo(px+9,py+1);x.closePath();x.fill();}
    else{x.beginPath();x.arc(px,py,1.6,0,7);x.fill();}}
  x.globalAlpha=1;CARPET=ctx.createPattern(c,'repeat');return CARPET;
}
// sunburst stripes like the page header
function sunburst(x0,y0,w,h,a='#c43a2a',b='#e8663a',spin=0){
  ctx.save();ctx.beginPath();ctx.rect(x0,y0,w,h);ctx.clip();rect(x0,y0,w,h,a);ctx.fillStyle=b;
  const cx=x0+w/2,cy=y0+h*3.2,R=w+h*4;
  for(let i=0;i<36;i+=2){const t0=(i/36)*Math.PI*2+spin,t1=((i+1)/36)*Math.PI*2+spin;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(t0)*R,cy+Math.sin(t0)*R);ctx.lineTo(cx+Math.cos(t1)*R,cy+Math.sin(t1)*R);ctx.closePath();ctx.fill();}
  ctx.restore();
}

/* ---------- lobby (character select) ---------- */
const L={slots:[],cd:0,last:-1};
function lobbyReset(){L.slots=[];L.cd=0;L.last=-1;}
function slotOf(d){return L.slots.find(s=>s.dev===d);}
function takenBy(h,except){return L.slots.some(s=>s!==except&&s.locked&&s.cur===h);}
function lobbyJoin(d){
  if(L.slots.length>=4||slotOf(d))return;
  let pi=0;while(L.slots.some(s=>s.pi===pi))pi++;
  if(!isPad(d)){const pref=+d.slice(2)-1;if(!L.slots.some(s=>s.pi===pref))pi=pref;}
  let c=0;for(let i=0;i<4;i++){if(!takenBy(i)&&!L.slots.some(s=>s.cur===i)){c=i;break;}}

function updSelect(){
  for(const d of devs()){const s=slotOf(d);
    if(!s){if(okHit(d)){lobbyJoin(d);rumble(d,.4,150);}continue;}
    if(!s.locked){
      const mv=(hit(d,'right')?1:0)-(hit(d,'left')?1:0);
      if(mv){for(let i=0;i<4;i++){s.cur=(s.cur+mv+4)%4;if(!takenBy(s.cur,s))break;}L.last=L.slots.indexOf(s);beep(440,.05);}
      if(okHit(d)&&!takenBy(s.cur,s)){s.locked=true;L.last=L.slots.indexOf(s);beep(880,.12,'square',.05,.5);rumble(d,.6,120);}
      else if(backHit(d)){L.slots.splice(L.slots.indexOf(s),1);L.last=L.slots.length-1;beep(220,.1);}
    }else if(backHit(d)){s.locked=false;L.cd=0;}
  }
  if(hit('menu','back')||(!L.slots.length&&devs().some(d=>isPad(d)&&hit(d,'back')))){lobbyReset();scene='title';beep(330,.08);}
  if(STG.max>1&&!L.cd){const mv=(menuHit('down')?1:0)-(menuHit('up')?1:0);if(mv){STG.cur=(STG.cur-1+mv+STG.max)%STG.max+1;beep(600,.05);}}
  if(L.slots.length&&L.slots.every(s=>s.locked)){if(++L.cd>75){newGame();scene='intro';introT=0;}}else L.cd=0;
}

/* ---------- game setup: the shared core runs the rules, this file feeds it inputs and shows its events ---------- */
const FX={parts:[],texts:[]};let shakeV=0;
// Per-body render memory (not part of the sim): previous height for landing squash, a short position trail for afterimages, combo pops.
const FXE=new Map();
function fxe(key,x,y,z){let m=FXE.get(key);if(!m){m={pz:z,sq:0,hist:[],pop:0,combo:0};FXE.set(key,m);}
  if(m.pz>0&&z<=0){m.sq=9;for(let i=0;i<5;i++)FX.parts.push({x:x+rnd(-6,6),y:y+rnd(-2,2),z:0,vx:rnd(-1.2,1.2),vy:0,vz:rnd(.3,1.1),t:rnd(8,14),c:i%2?'#8a7a6a':'#b8a890',s:2,g:.05});}
  m.pz=z;if(m.sq>0)m.sq--;m.hist.unshift({x,y,z});if(m.hist.length>4)m.hist.length=4;return m;}
const squash=(o,m)=>{if(m.sq>0){const k=m.sq/9;o.sx=(o.sx||1)*(1+.16*k);o.sy=(o.sy||1)*(1-.16*k);}};
const active=()=>G?C.active(G):[];
function playerSpec(slot,hero){return {slot,hero,st:calcStats(HEROES[hero].id),look:gearLook(HEROES[hero].id)};}
function newGame(){
  const slots=L.slots.slice().sort((a,b)=>a.pi-b.pi);
  G=C.newGame(slots.map(s=>playerSpec(s.pi,s.cur)),STG.cur,DIFFSEL);
  slots.forEach(s=>{const p=G.ps.find(q=>q.slot===s.pi);if(p)p.dev=s.dev;});
  FX.parts=[];FX.texts=[];shakeV=0;G.endT=0;
}
const ACT7=['up','down','left','right','atk','jump','spec','start'];
function feedInputs(){
  for(const p of G.ps){if(!p.dev||p.lostPad){p.in={};continue;}const d=p.dev,o={};for(const a of ACT7)o[a]=held(d,a);p.in=o;}
}
function dropIn(){
  const g=G;
  for(const d of devs()){
    if(g.ps.some(q=>q.dev===d))continue;
    const want=isPad(d)?okHit(d):d==='kb1'?hit(d,'start'):hit(d,'start')||hit(d,'atk'); // J on the left keyboard never joins by accident
    if(!want)continue;
    if(claimLost(d))continue;
    if(g.ps.length>=4)continue;
    let slot=0;while(g.ps.some(q=>q.slot===slot))slot++;
    const np=C.addPlayer(g,{slot});if(!np)continue;
    np.dev=d;applyGear(np,true);rumble(d,.5,160);renderPadList();
  }
}
function localStep(){
  feedInputs();dropIn();C.step(G);drainEvents(G.ev);
  stageProgress();
  if(G.status==='over'){scene='over';G.endT=0;saveHi();}else if(G.status==='win'){scene='win';G.endT=0;saveHi();}
}
function stageProgress(){if(!G)return;unlockTo((G.level||1)+(G.status==='clear'||G.status==='win'?1:0));if(G.status==='over'||G.status==='clear')STG.cur=Math.min(STG.max,G.level+(G.status==='clear'?1:0));}
function devOfSlot(slot){const p=G&&G.ps.find(q=>q.slot===slot);return p?p.dev:null;}
function sparksAt(x,y,z,n=6,cols=['#ffffff','#ffc93c','#ff9a3c']){for(let i=0;i<n;i++)FX.parts.push({x,y,z,vx:rnd(-2,2),vy:rnd(-.5,.5),vz:rnd(-1,2.5),t:rnd(8,16),c:cols[i%cols.length],s:2,g:.15});}
function drainEvents(list){
  for(const e of list){
    switch(e.t){
    case 'beep':if(e.dl)setTimeout(()=>beep(e.f,e.d,e.ty,e.v,e.sl),e.dl);else beep(e.f,e.d,e.ty,e.v,e.sl);break;
    case 'rumble':{const d=devOfSlot(e.slot);if(d)rumble(d,e.str,e.ms);break;}
    case 'toast':toast(e.s,e.c);break;
    case 'stage':FX.parts=[];FX.texts=[];shakeV=0;break;
    case 'text':FX.texts.push({x:e.x,y:e.y,z:e.z,s:e.s,c:e.c,t:60});break;
    case 'shake':shakeV=Math.max(shakeV,e.v);break;
    case 'fx':
      if(e.k==='sparks')sparksAt(e.x,e.y,e.z,e.n,e.c||undefined);
      else if(e.k==='goo')sparksAt(e.x,e.y,e.z,e.n,['#c8f05a','#9ccf3a','#eaff9a']);
      else if(e.k==='smoke')FX.parts.push({x:e.x,y:e.y,z:e.z,vx:rnd(-.3,.3),vy:0,vz:.6,t:24,c:'#8a8496',s:3,g:0});
      else FX.parts.push({x:e.x,y:e.y,z:e.z,vx:e.vx||0,vy:e.vy||0,vz:e.vz||0,t:e.l||10,c:e.c,s:e.s||2,g:e.gv||0});
      break;
    case 'loot':{const p=G.ps.find(q=>q.slot===e.slot);if(p&&(!NET.on||e.slot===NET.slot))onLoot(p,e.item,e.x,e.y);break;}
    case 'gearhint':{const p=G.ps.find(q=>q.slot===e.slot);if(p&&p.dev)toast('P'+(p.slot+1)+': '+invKeyLabel(p)+' OPENS GEAR',PCOL[p.slot]);break;}
    }
  }
  list.length=0;
}
function updateFX(){
  shakeV*=.86;
  for(const q of FX.parts){q.x+=q.vx;q.y+=q.vy;q.z+=q.vz;q.vz-=q.g;if(q.z<0){q.z=0;q.vx*=.6;}q.t--;}
  FX.parts=FX.parts.filter(q=>q.t>0);
  for(const t of FX.texts){t.z+=.45;t.t--;}FX.texts=FX.texts.filter(t=>t.t>0);
}

const NET={on:false,ws:null,code:'',slot:-1,token:null,dev:'kb1',lobby:null,snapMs:50,lastSnap:0,err:'',busy:false,held:0,sendT:0,cur:0,codeIn:['A','A','A','A'],col:0,ready:false,gone:false,tries:0};

function serverBase(){let u=(serverEl.value||'').trim().replace(/\/+$/,'')||DEFAULT_SERVER;if(u&&!/^https?:\/\//.test(u))u='https://'+u;return u;}
const BITS={up:1,down:2,left:4,right:8,atk:16,jump:32,spec:64,start:128};

async function netHost(){
  const base=serverBase();if(!base){NET.err='SET THE SERVER ADDRESS BELOW THE GAME';return;}
  NET.busy=true;NET.err='';
  try{const r=await fetch(base+'/rooms',{method:'POST'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();netJoin(j.code);}
  catch(e){NET.err='COULD NOT REACH SERVER';NET.busy=false;}
}
function netJoin(code){
  const base=serverBase();if(!base){NET.err='SET THE SERVER ADDRESS BELOW THE GAME';return;}
  NET.busy=true;NET.err='';NET.code=code.toUpperCase();NET.gone=false;
  let ws;try{ws=new WebSocket(base.replace(/^http/,'ws')+'/rooms/'+NET.code+'/ws');}catch(e){NET.err='BAD SERVER ADDRESS';NET.busy=false;return;}
  NET.ws=ws;
  ws.onopen=()=>{NET.tries=0;netSend({t:'join',token:NET.token,name:'P',...myGear()});};
  ws.onmessage=m=>{let d;try{d=JSON.parse(m.data);}catch(e){return;}netMsg(d);};
  ws.onclose=()=>{if(NET.ws!==ws)return;NET.ws=null;
    if(NET.gone){netLeave(true);return;}
    if(NET.on&&(scene==='play'||scene==='pause'||scene==='inv'||scene==='intro')&&NET.tries<8){NET.tries++;toast('CONNECTION LOST, RECONNECTING','#ff7a5a');setTimeout(()=>{if(!NET.ws&&NET.on)netJoin(NET.code);},1000*Math.min(5,NET.tries));}
    else{if(NET.busy&&!NET.err)NET.err='ROOM NOT FOUND';netLeave(true);}};
  ws.onerror=()=>{if(NET.busy&&!NET.err)NET.err='COULD NOT CONNECT';};
}
function netLeave(silent){
  const ws=NET.ws;NET.gone=true;NET.ws=null;if(ws){try{ws.send(JSON.stringify({t:'leave'}));}catch(e){}try{ws.close();}catch(e){}}

function netMsg(d){

    NET.serverCore=d.core||'OLD';if(NET.serverCore!==C.CORE_VERSION)toast('ROOM SERVER IS OUT OF DATE: REDEPLOY IT','#ff7a5a');
    if(scene==='online'||scene==='join')scene='nlobby';break;
  case 'lobby':NET.lobby=d;if(scene==='play'||scene==='pause'||scene==='inv'||scene==='over'||scene==='win'||scene==='intro'){if(d.status==='lobby'){scene='nlobby';G=null;}}
    else if(scene==='nlobby'&&d.status!=='lobby'){scene='play';toast('JOINED A GAME IN PROGRESS','#3ad6c0');}break;
  case 'start':G=null;FX.parts=[];FX.texts=[];shakeV=0;scene='intro';introT=0;NET.ready=false;break;
  case 'snap':{if(!G)G={ps:[],enemies:[],proj:[],pick:[],surv:[],waves:[],ev:[],net:true,endT:0};

/* End screen: the run's rental history. Same receipt for game over and for beating the game, with run stats. */
function drawEndScreen(g,won){

  cols.forEach(([h,x])=>txt(h,x,ry+70,'#7a4a2e','right',8,null));
  const mvp=ps.length>1?ps.reduce((a,b)=>b.score>a.score?b:a):null;
  ps.forEach((p,i)=>{const y=ry+82+i*12,r=p.rs||{},lt=r.lt||{},loot=(lt.c||0)+(lt.r||0)+(lt.u||0)+(lt.s||0);
    rect(rx+8,y-1,4,9,PCOL[p.slot]);txt(p.ch.first,rx+15,y,INK,'left',8,null);
    const v=p.rs?[String(p.score).padStart(7,'0'),r.k||0,Math.round(r.dd||0),Math.round(r.dt||0),r.mc||0,r.ld||0,loot]:[String(p.score).padStart(7,'0'),'-','-','-','-','-','-'];
    v.forEach((x,j)=>txt(String(x),cols[j][1],y,j===6&&(lt.u||lt.s)?'#b8426a':INK,'right',8,null));
    if(p===mvp&&p.score>0){txt(p.ch.first,rx+15,y,'#b8261e','left',8,null);}});
  const yb=ry+84+ps.length*12;dash(yb);
  // loot summary + notes
  const L=ps.reduce((a,p)=>{const lt=(p.rs||{}).lt||{};for(const k in lt)a[k]=(a[k]||0)+lt[k];return a;},{});
  if(!has){txt('NO RUN STATS: THE ROOM SERVER NEEDS AN UPDATE',rx+10,yb+6,'#b8261e','left',8,null);}
  else{txt('LOOT',rx+10,yb+6,INK,'left',8,null);[['c','COMMON'],['r','RARE'],['u','ULTRA'],['s','SET']].forEach(([k,n],i)=>txt((L[k]||0)+' '+n,rx+60+i*76,yb+6,{c:'#7a4a2e',r:'#1f8a7a',u:'#c2306e',s:'#4a7a12'}[k],'left',8,null));}
  const cu=ps.reduce((a,p)=>a+((p.rs||{}).cu||0),0);if(has)txt('CONTINUES USED '+cu,rx+10,yb+18,INK,'left',8,null);
  if(mvp&&mvp.score>0){const w=tag('MVP',W/2-36,yb+16,'#ffc93c');txt(mvp.ch.first,W/2-36+w+4,yb+18,'#b8261e','left',8,null);}
  if(g.score>=hi&&g.score>0)txt('NEW HIGH SCORE!',rx+rw-10,yb+18,'#b8261e','right',8,null);

  stamp(won?'PAID IN FULL':'OVERDUE',rx+rw-72,ry+rh-26,'#e8453c',-.14,won?8:16);

}

// word-wrap for the 8px pixel font (8px per character)
function wrapLines(s,maxCh){const out=[];let line='';for(const w of String(s).split(' ')){if((line+(line?' ':'')+w).length>maxCh){if(line)out.push(line);line=w;}else line+=(line?' ':'')+w;}if(line)out.push(line);return out;}
function updGuide(){
  const P=guidePages(),n=P.length;
  if(menuHit('right')){GUIDE.cur=(GUIDE.cur+1)%n;GUIDE.scroll=0;beep(520,.05);}
  if(menuHit('left')){GUIDE.cur=(GUIDE.cur+n-1)%n;GUIDE.scroll=0;beep(520,.05);}
  if(menuHit('down'))GUIDE.scroll++;if(menuHit('up'))GUIDE.scroll=Math.max(0,GUIDE.scroll-1);
  if(menuHit('back')||menuHit('ok')||hit('menu','back'))closeGuide();
}
function drawGuide(){
  const P=guidePages(),pg=P[GUIDE.cur%P.length];
  uiBg('GUIDE',(GUIDE.cur+1)+'/'+P.length,'#d9a87c');
  // page tabs: one dot per page
  P.forEach((q,i)=>{const x=W/2-P.length*6+i*12;rect(x,27,8,4,i===GUIDE.cur?q.c:'#5e2f22');});

    if(pg.inline){wrapLines(h+': '+b,44).forEach((l,i)=>lines.push([l,i===0?h.length+1:0]));}
    else{lines.push([h,-1]);wrapLines(b,43).forEach(l=>lines.push([l,0]));}
    lines.push(null);}
  const per=15,maxS=Math.max(0,lines.length-per);GUIDE.scroll=Math.min(GUIDE.scroll,maxS);
  lines.slice(GUIDE.scroll,GUIDE.scroll+per).forEach((ln,i)=>{if(!ln)return;const y=54+i*9,[s,hl]=ln;

    else txt(s,(pg.inline?14:20),y,'#ffe9c2','left',8,null);});

}
